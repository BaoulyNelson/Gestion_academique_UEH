<div class="col-md-6 mb-3">
  <label class="form-label" for="{{ champ.id_for_label }}"
    >{{ champ.label }}{% if champ.field.required %}<span class="texte-requis">
      *</span
    >{% endif %}</label
  >
  {{ champ }} {% if champ.help_text %}
  <div class="form-text">{{ champ.help_text }}</div>
  {% endif %} {% for erreur in champ.errors %}
  <div class="invalid-feedback d-block">{{ erreur }}</div>
  {% endfor %}
</div>
